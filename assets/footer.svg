<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Thanks for stopping by. Let's build something cool together.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#1b1b3a"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="750" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="150" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="150" fill="url(#bg)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
      <path d="M0 95 Q125 65 250 95 T500 95 T750 95 T1000 95 T1250 95 T1500 95 L1500 150 L0 150 Z" fill="url(#waveA)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="18s" repeatCount="indefinite"/>
      <path d="M0 115 Q150 90 300 115 T600 115 T900 115 T1200 115 T1500 115 T1800 115 L1800 150 L0 150 Z" fill="url(#waveB)"/>
    </g>
  </g>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="500" y="62" font-size="28" font-weight="700" fill="url(#txt)">Thanks for stopping by!</text>
    <text x="500" y="94" font-size="16" fill="#cbd5e1" letter-spacing="1">Let's build something cool together.</text>
  </g>
</svg>
