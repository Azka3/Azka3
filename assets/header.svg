<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Azka Zakiyyan - Web Developer, Game Developer, Mobile Developer and 3D Artist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#1b1b3a"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="660" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="320" rx="22"/></clipPath>
    <style>
      .rise { animation: rise 1s ease-out both; }
      .d1 { animation-delay: .2s; }
      .d2 { animation-delay: .6s; }
      .d3 { animation-delay: 1s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <!-- soft glows -->
    <circle cx="180" cy="60" r="190" fill="#22d3ee" opacity="0.10">
      <animate attributeName="cx" values="180;280;180" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="270" r="210" fill="#f472b6" opacity="0.10">
      <animate attributeName="cx" values="830;730;830" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle class="twinkle" cx="90" cy="50" r="2"/>
      <circle class="twinkle" style="animation-delay:.6s" cx="210" cy="120" r="1.5"/>
      <circle class="twinkle" style="animation-delay:1.2s" cx="330" cy="40" r="2"/>
      <circle class="twinkle" style="animation-delay:1.8s" cx="470" cy="85" r="1.5"/>
      <circle class="twinkle" style="animation-delay:.3s" cx="640" cy="45" r="2"/>
      <circle class="twinkle" style="animation-delay:.9s" cx="760" cy="110" r="1.5"/>
      <circle class="twinkle" style="animation-delay:1.5s" cx="900" cy="55" r="2"/>
      <circle class="twinkle" style="animation-delay:2.1s" cx="940" cy="160" r="1.5"/>
      <circle class="twinkle" style="animation-delay:2.4s" cx="60" cy="190" r="1.5"/>
    </g>

    <!-- floating shapes: cube / hexagon / triangle / ring -->
    <g transform="translate(110 130)" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/>
        <polygon points="0,-26 24,-13 24,13 0,26 -24,13 -24,-13" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
        <g stroke="#22d3ee" stroke-width="2">
          <line x1="0" y1="0" x2="0" y2="26"/>
          <line x1="0" y1="0" x2="24" y2="-13"/>
          <line x1="0" y1="0" x2="-24" y2="-13"/>
        </g>
      </g>
    </g>
    <g transform="translate(890 105)" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="6s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
          <polygon points="0,-26 26,20 -26,20" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <g transform="translate(160 235)" opacity="0.5">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="7s" repeatCount="indefinite"/>
        <circle r="18" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="8 6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <g transform="translate(845 235)" opacity="0.5">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5.5s" repeatCount="indefinite"/>
        <rect x="-15" y="-15" width="30" height="30" rx="6" fill="none" stroke="#22d3ee" stroke-width="2.5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- waves -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
      <path d="M0 250 Q125 215 250 250 T500 250 T750 250 T1000 250 T1250 250 T1500 250 L1500 320 L0 320 Z" fill="url(#waveA)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="18s" repeatCount="indefinite"/>
      <path d="M0 270 Q150 240 300 270 T600 270 T900 270 T1200 270 T1500 270 T1800 270 L1800 320 L0 320 Z" fill="url(#waveB)"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text class="rise d1" x="500" y="150" font-size="30" font-weight="500" fill="#c7d2fe" letter-spacing="6">HI THERE, I'M</text>
    <text class="rise d2" x="500" y="212" font-size="68" font-weight="800" fill="url(#title)">Azka Zakiyyan</text>
    <text class="rise d3" x="500" y="258" font-size="19" fill="#cbd5e1" letter-spacing="2">Web  ·  Game  ·  Mobile  ·  3D Art</text>
    <text class="rise d3" x="500" y="292" font-size="15" fill="#94a3b8" letter-spacing="1">Bandung, Indonesia</text>
  </g>
</svg>
